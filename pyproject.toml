[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "graph-il-rl-for-benders"
version = "0.1.0"
description = "Graph-based imitation and reinforcement learning workflows for Benders decomposition."
readme = "README.md"
requires-python = ">=3.8,<3.10"
authors = [
  { name = "Bernard T. Agyeman" },
  { name = "Zhe Li" },
  { name = "Ilias Mitrai" },
  { name = "Prodromos Daoutidis" },
]
dependencies = []

[project.optional-dependencies]
research = [
  "numpy==1.19.5",
  "scipy==1.10.1",
  "matplotlib==3.5.1",
  "pandas==1.4.4",
  "casadi==3.5.5",
  "pyomo==6.8.2",
  "tensorflow==2.6.0",
  "keras==2.6.0",
  "tensorboard==2.6.0",
  "tensorflow-estimator==2.6.0",
  "tensorflow-probability==0.14.0",
  "protobuf==3.20.3",
  "spektral==1.1.0",
  "tqdm==4.67.1",
  "seaborn==0.11.2",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6.9",
  "black==20.8b1",
  "pre-commit==3.5.0",
]

[project.scripts]
graph-bd = "graph_il_rl_for_benders.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_il_rl_for_benders"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
